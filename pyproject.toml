[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "tvscraper"
version = "0.2.0"
description = "Near-real-time market data from TradingView's chart WebSocket feed - quotes, OHLCV bars, and a verification dashboard, no account needed"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = ["websocket-client>=1.7.0"]

[project.scripts]
tvscraper = "tvscraper.cli:main"

[tool.setuptools]
packages = ["tvscraper"]

[tool.setuptools.package-data]
tvscraper = ["static/*.html"]
